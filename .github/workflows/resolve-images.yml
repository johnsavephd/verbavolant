name: Resolve images
on:
  workflow_dispatch:   # run by hand after changing tools/image_plan.py
permissions:
  contents: write
concurrency:
  group: daily-saying   # shares the lock with the daily send, so they never edit files at once
  cancel-in-progress: false
jobs:
  resolve:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install requests
      - run: python tools/resolve_images.py
      - name: Save results
        run: |
          git config user.name "detto-bot"
          git config user.email "detto-bot@users.noreply.github.com"
          git add sayings.json REVIEW.md
          git diff --cached --quiet && exit 0
          git commit -m "Resolve painting images"
          # retry: if the repo changed meanwhile, rebase on top of it and push again
          for i in 1 2 3 4 5; do git pull --rebase && git push && exit 0; sleep $((i*5)); done
          echo "Could not save resolve painting images" && exit 1
