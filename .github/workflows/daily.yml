name: Verba Volant daily
on:
  schedule:
    # Several off-the-hour runs (UTC): the first one after 7:30 Rome time sends,
    # the others see today's entry in history.json and exit. Covers delays and summer time.
    - cron: "37 5 * * *"
    - cron: "37 6 * * *"
    - cron: "13 7 * * *"
    - cron: "43 8 * * *"
    - cron: "23 11 * * *"
  workflow_dispatch:
    inputs:
      saying:
        description: "Preview one saying by its Latin text (e.g. Vae victis). Leave empty for a normal daily send."
        required: false
        default: ""
concurrency:
  group: daily-saying   # never two runs at once, so no double send
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python daily_detto.py
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          FORCE_SAYING: ${{ github.event.inputs.saying }}
      - name: Salva lo storico dei detti
        run: |
          git config user.name "detto-bot"
          git config user.email "detto-bot@users.noreply.github.com"
          git add history.json
          git diff --cached --quiet && exit 0
          git commit -m "Aggiorna storico"
          # retry: if the repo changed meanwhile, rebase on top of it and push again
          for i in 1 2 3 4 5; do git pull --rebase && git push && exit 0; sleep $((i*5)); done
          echo "Could not save aggiorna storico" && exit 1
