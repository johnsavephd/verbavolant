name: Verba Volant daily
on:
  schedule:
    # Several off-the-hour runs (UTC): the first one after 8:40 Rome time sends,
    # the others see today's entry in history.json and exit. Covers delays and summer time.
    - cron: "41 6 * * *"
    - cron: "41 7 * * *"
    - cron: "17 8 * * *"
    - cron: "47 9 * * *"
    - cron: "23 12 * * *"
  workflow_dispatch:       # lancio manuale per i test
concurrency:
  group: daily-saying   # never two runs at once, so no double send
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python daily_detto.py
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      - name: Salva lo storico dei detti
        run: |
          git config user.name "detto-bot"
          git config user.email "detto-bot@users.noreply.github.com"
          git add history.json
          git diff --cached --quiet || (git commit -m "Aggiorna storico" && git push)
