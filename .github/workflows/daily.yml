name: Verba Volant daily
on:
  schedule:
    - cron: "0 7 * * *"   # 9:00 a Roma in estate
    - cron: "0 8 * * *"   # 9:00 a Roma in inverno (lo script filtra l'ora giusta)
  workflow_dispatch:       # lancio manuale per i test
permissions:
  contents: write
jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python daily_detto.py
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      - name: Salva lo storico dei detti
        run: |
          git config user.name "detto-bot"
          git config user.email "detto-bot@users.noreply.github.com"
          git add history.json
          git diff --cached --quiet || (git commit -m "Aggiorna storico" && git push)
